# nginx site config for the API backend (api.svenhaase.de).
#
# Install on the server with:
#   sudo cp deploy/nginx-api.conf /etc/nginx/sites-available/coderr
#   sudo ln -s /etc/nginx/sites-available/coderr /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# This file is the plain HTTP version. After you run certbot (see DEPLOYMENT.md),
# certbot rewrites it to add the HTTPS (443) server block and a redirect.

server {
    listen 80;
    listen [::]:80;
    server_name api.svenhaase.de;

    # Allow profile/offer image uploads up to 10 MB.
    client_max_body_size 10M;

    # Serve collected static files (Django admin, DRF browsable API) directly.
    location /static/ {
        alias /home/coderr/app/staticfiles/;
    }

    # Serve uploaded media (profile pictures, offer images) directly.
    location /media/ {
        alias /home/coderr/app/media/;
    }

    # Everything else goes to gunicorn.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
